<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de la compra</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
        }

        .entrada {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-top: 8px;
            background: #f1f1f1;
            border-radius: 10px;
        }

        .comprado {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="contenedor">

    <h1>🛒 Lista de la compra</h1>

    <div class="entrada">
        <input id="producto" placeholder="Añadir producto...">
        <button onclick="añadir()">+</button>
    </div>

    <ul id="lista"></ul>

</div>

<script>
const SUPABASE_URL = "TU_URL";
const SUPABASE_ANON_KEY = "TU_CLAVE";
let productos = JSON.parse(localStorage.getItem("listaCompra")) || [];

function guardar() {
    localStorage.setItem("listaCompra", JSON.stringify(productos));
}

function mostrar() {

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    productos.forEach((producto, indice) => {

        const li = document.createElement("li");

        li.innerHTML = `
            <span onclick="comprar(${indice})"
                  class="${producto.comprado ? 'comprado' : ''}">
                ${producto.nombre}
            </span>

            <button onclick="eliminar(${indice})">🗑️</button>
        `;

        lista.appendChild(li);
    });
}

function añadir() {

    const input = document.getElementById("producto");
    const nombre = input.value.trim();

    if (nombre === "") return;

    productos.push({
        nombre: nombre,
        comprado: false
    });

    input.value = "";

    guardar();
    mostrar();
}

function comprar(indice) {

    productos[indice].comprado =
        !productos[indice].comprado;

    guardar();
    mostrar();
}

function eliminar(indice) {

    productos.splice(indice, 1);

    guardar();
    mostrar();
}

mostrar();
const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);
</script>

</body>
</html>
