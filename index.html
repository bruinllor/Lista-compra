<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de la compra</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
        }

        .entrada {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-top: 8px;
            background: #f1f1f1;
            border-radius: 10px;
        }

        .comprado {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>

    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="contenedor">

    <h1>🛒 Lista de la compra</h1>

    <div class="entrada">
        <input id="producto" placeholder="Añadir producto...">
        <button onclick="añadir()">+</button>
    </div>

    <ul id="lista"></ul>

</div>

<script>

const SUPABASE_URL = "https://neydfkskvcqyaaegmjpg.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "sb_publishable_VpIQv26CiA9t9Jei12AlSQ_fMWg8Xlx";

const clienteSupabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// Cargar productos desde Supabase
async function cargarProductos() {

    const { data, error } = await clienteSupabase
        .from("productos")
        .select("*")
        .order("id", { ascending: true });

    if (error) {
        console.error("Error al cargar productos:", error);
        return;
    }

    productos = data;
    mostrar();
}


// Variable donde guardamos los productos
let productos = [];


// Mostrar productos
function mostrar() {

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    productos.forEach((producto, indice) => {

        const li = document.createElement("li");

        li.innerHTML = `
            <span onclick="comprar(${indice})"
                  class="${producto.comprado ? 'comprado' : ''}">
                ${producto.nombre}
            </span>

            <button onclick="eliminar(${indice})">🗑️</button>
        `;

        lista.appendChild(li);
    });
}


// Añadir producto
async function añadir() {

    const input = document.getElementById("producto");
    const nombre = input.value.trim();

    if (nombre === "") return;

    const { data, error } = await clienteSupabase
        .from("productos")
        .insert({
            nombre: nombre,
            comprado: false,
            usuario: "principal"
        })
        .select();

    if (error) {
        console.error("Error al añadir producto:", error);
        alert("No se pudo añadir el producto.");
        return;
    }

    input.value = "";

    cargarProductos();
}


// Marcar como comprado
async function comprar(indice) {

    const producto = productos[indice];

    const { error } = await clienteSupabase
        .from("productos")
        .update({
            comprado: !producto.comprado
        })
        .eq("id", producto.id);

    if (error) {
        console.error("Error al actualizar producto:", error);
        return;
    }

    cargarProductos();
}


// Eliminar producto
async function eliminar(indice) {

    const producto = productos[indice];

    const { error } = await clienteSupabase
        .from("productos")
        .delete()
        .eq("id", producto.id);

    if (error) {
        console.error("Error al eliminar producto:", error);
        return;
    }

    cargarProductos();
}


// Cargar la lista al abrir la página
cargarProductos();

</script>

</body>
</html>
